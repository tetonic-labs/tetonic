[package]
name = "tetonic-eval"
version = "0.1.0"
edition = "2021"
description = "Tetonic Evaluation Harness for deterministic and statistical evaluation."
publish = false

[[bin]]
name = "tetonic-eval"
path = "src/main.rs"

[lib]
name = "tetonic_eval"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }
async-trait = { workspace = true }
lokai-telemetry = { package = "tetonic-telemetry", path = "../../core/tetonic-telemetry" }
lokai-app = { path = "../../litho/lokai-app" }
lokai-memory = { package = "tetonic-memory", path = "../../strata/tetonic-memory" }
lokai-policy = { package = "tetonic-policy", path = "../../core/tetonic-policy" }
lokai-runtime = { package = "tetonic-runtime", path = "../../core/tetonic-runtime" }
lokai-broker = { package = "tetonic-broker", path = "../../mantle/tetonic-broker" }
lokai-inference = { package = "tetonic-inference", path = "../../atmos/tetonic-inference" }
lokai-sandbox = { package = "tetonic-sandbox", path = "../../core/tetonic-sandbox" }
lokai-secrets = { package = "tetonic-secrets", path = "../../core/tetonic-secrets" }
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
lokai-core = { package = "tetonic-core", path = "../../core/tetonic-core" }
lokai-orchestrator = { package = "tetonic-orchestrator", path = "../../mantle/tetonic-orchestrator" }
lokai-artifact = { package = "tetonic-artifact", path = "../../strata/tetonic-artifact" }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
lokai-artifact = { package = "tetonic-artifact", path = "../../strata/tetonic-artifact" }
