[package]
name = "tetonic-eval"
version = "0.1.0"
edition = "2021"
description = "Tetonic Evaluation Harness for deterministic and statistical evaluation."
publish = false

[[bin]]
name = "tetonic-eval"
path = "src/main.rs"

[lib]
name = "tetonic_eval"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
uuid = { version = "1.10", features = ["v4"] }
async-trait = { workspace = true }
tetonic-telemetry = { path = "../../core/tetonic-telemetry" }
tetonic-app = { path = "../../litho/tetonic-app" }
tetonic-memory = { path = "../../strata/tetonic-memory" }
tetonic-policy = { path = "../../core/tetonic-policy" }
tetonic-runtime = { path = "../../core/tetonic-runtime" }
tetonic-broker = { path = "../../mantle/tetonic-broker" }
tetonic-inference = { path = "../../atmos/tetonic-inference" }
tetonic-sandbox = { path = "../../core/tetonic-sandbox" }
tetonic-secrets = { path = "../../core/tetonic-secrets" }
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-core = { path = "../../core/tetonic-core" }
tetonic-orchestrator = { path = "../../mantle/tetonic-orchestrator" }
tetonic-artifact = { path = "../../strata/tetonic-artifact" }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
tetonic-artifact = { path = "../../strata/tetonic-artifact" }
