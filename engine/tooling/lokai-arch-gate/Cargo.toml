[package]
name = "lokai-arch-gate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "lokai_arch_gate"
path = "src/lib.rs"

[[bin]]
name = "lokai-arch-gate"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = { workspace = true }
lokai-rpc = { path = "../../atmos/lokai-rpc" }
clap = { workspace = true }

[dev-dependencies]
lokai-core = { path = "../../core/lokai-core" }
lokai-domain = { path = "../../core/lokai-domain" }
lokai-egress = { path = "../../atmos/lokai-egress" }
lokai-inference = { path = "../../atmos/lokai-inference" }
lokai-memory = { path = "../../strata/lokai-memory" }
lokai-runtime = { path = "../../core/lokai-runtime" }
lokai-tools = { path = "../../litho/lokai-tools" }
lokai-transaction = { path = "../../core/lokai-transaction" }
lokai-policy = { path = "../../core/lokai-policy" }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
lokai-artifact = { path = "../../strata/lokai-artifact" }
