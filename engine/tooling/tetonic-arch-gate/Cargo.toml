[package]
name = "tetonic-arch-gate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "tetonic_arch_gate"
path = "src/lib.rs"

[[bin]]
name = "tetonic-arch-gate"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = { workspace = true }
lokai-rpc = { package = "tetonic-rpc", path = "../../atmos/tetonic-rpc" }
clap = { workspace = true }

[dev-dependencies]
lokai-core = { package = "tetonic-core", path = "../../core/tetonic-core" }
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
lokai-egress = { package = "tetonic-egress", path = "../../atmos/tetonic-egress" }
lokai-inference = { package = "tetonic-inference", path = "../../atmos/tetonic-inference" }
lokai-memory = { package = "tetonic-memory", path = "../../strata/tetonic-memory" }
lokai-runtime = { package = "tetonic-runtime", path = "../../core/tetonic-runtime" }
lokai-tools = { path = "../../litho/lokai-tools" }
lokai-transaction = { package = "tetonic-transaction", path = "../../core/tetonic-transaction" }
lokai-policy = { package = "tetonic-policy", path = "../../core/tetonic-policy" }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
lokai-artifact = { package = "tetonic-artifact", path = "../../strata/tetonic-artifact" }
