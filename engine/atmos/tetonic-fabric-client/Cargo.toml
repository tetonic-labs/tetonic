[package]
name = "tetonic-fabric-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "tetonic_fabric_client"

[dependencies]
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-fabric-protocol = { path = "../../atmos/tetonic-fabric-protocol" }
tetonic-egress = { path = "../../atmos/tetonic-egress" }
tetonic-enroll = { path = "../../mantle/tetonic-enroll" }
tetonic-inference = { path = "../../atmos/tetonic-inference" }
tetonic-transaction = { path = "../../core/tetonic-transaction" }
tetonic-artifact = { path = "../../strata/tetonic-artifact" }
tetonic-memory = { path = "../../strata/tetonic-memory" }
tetonic-telemetry = { path = "../../core/tetonic-telemetry" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tracing = { workspace = true }
async-trait.workspace = true
reqwest = { workspace = true }
url = { workspace = true }
ed25519-dalek = { version = "2", features = ["zeroize", "pkcs8"] }
x509-parser = "0.16"
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tetonic-run = { path = "../../mantle/tetonic-run" }
tempfile = "3"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }

[[test]]
name = "result_accept_adversarial"
path = "tests/result_accept_adversarial.rs"
