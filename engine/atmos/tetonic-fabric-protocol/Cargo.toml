[package]
name = "tetonic-fabric-protocol"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "tetonic_fabric_protocol"

[dependencies]
tetonic-domain = { path = "../../core/tetonic-domain" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
ed25519-dalek = { version = "2", features = ["zeroize", "rand_core"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[[test]]
name = "capability_conformance"
path = "tests/capability_conformance.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "fuzz_decode"
path = "tests/fuzz_decode.rs"

[[test]]
name = "result_integrity"
path = "tests/result_integrity.rs"
