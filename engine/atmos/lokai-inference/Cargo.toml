[package]
name = "lokai-inference"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Note: deliberately does NOT depend on reqwest. All network goes through
# lokai-egress (Charter Right 1). See contracts/inference-fabric-v1.md.
[dependencies]
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
lokai-egress = { path = "../../atmos/lokai-egress" }
lokai-fabric-protocol = { path = "../../atmos/lokai-fabric-protocol" }
lokai-policy = { package = "tetonic-policy", path = "../../core/tetonic-policy" }
lokai-telemetry = { package = "tetonic-telemetry", path = "../../core/tetonic-telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
tracing = { workspace = true }
