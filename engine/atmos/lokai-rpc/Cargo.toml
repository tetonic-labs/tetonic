[package]
name = "lokai-rpc"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = false

# The single editor<->daemon boundary: stdio JSON-RPC framing + protocol types.
# Deliberately has NO engine dependencies (no inference/tools/egress): it is a
# transport + schema crate so the contract stays small and auditable, and so a
# TS client can be code-generated from these types. See contracts/agent-rpc-v1.md.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tokio = { workspace = true }
lokai-telemetry = { package = "tetonic-telemetry", path = "../../core/tetonic-telemetry" }

[dev-dependencies]
tokio = { workspace = true }
