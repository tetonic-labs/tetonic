[package]
name = "tetonic-inference"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Note: deliberately does NOT depend on reqwest. All network goes through
# lokai-egress (Charter Right 1). See contracts/inference-fabric-v1.md.
[lib]
name = "tetonic_inference"

[dependencies]
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-egress = { path = "../../atmos/tetonic-egress" }
tetonic-fabric-protocol = { path = "../../atmos/tetonic-fabric-protocol" }
tetonic-policy = { path = "../../core/tetonic-policy" }
tetonic-telemetry = { path = "../../core/tetonic-telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
tracing = { workspace = true }
