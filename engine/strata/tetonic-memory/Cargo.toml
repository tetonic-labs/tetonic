[package]
name = "tetonic-memory"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = false

# Durable control, execution, scoped context, usage, artifact bindings and audit.
# This SQLite persistence crate has no network client. Payload storage and
# distributed transport remain separate concerns; see README.md for ownership.
[lib]
name = "tetonic_memory"

[dependencies]
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-policy = { path = "../../core/tetonic-policy" }
tetonic-telemetry = { path = "../../core/tetonic-telemetry" }
rusqlite = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
fs2 = "0.4"
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
tempfile = "3"
