[package]
name = "tetonic-memory"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = false

# The precious, local-only audit/memory store (`lokai.db`). By design this crate
# has NO network capability: it never depends on `lokai-egress` or any HTTP
# client. It holds project content, so it stays on-device — see
# contracts/memory-store-v2.md (Privacy posture).
[lib]
name = "tetonic_memory"

[dependencies]
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-policy = { path = "../../core/tetonic-policy" }
tetonic-telemetry = { path = "../../core/tetonic-telemetry" }
rusqlite = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
fs2 = "0.4"
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
tempfile = "3"
