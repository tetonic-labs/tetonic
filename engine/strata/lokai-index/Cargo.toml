[package]
name = "lokai-index"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
rusqlite = { workspace = true }
ignore = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
# Structural layer (tree-sitter). Languages are pinned via `cargo add` to a set
# ABI-compatible with the core grammar version.

# Semantic ANN layer: pure-Rust HNSW for approximate nearest-neighbour search so
# semantic query cost stops growing linearly with corpus size. No C extension /
# no network — fits the local-only, minimal-supply-chain stance. Brute force
# remains the small-corpus fallback.
instant-distance = "0.6"
notify = "8"
notify-debouncer-full = "0.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
