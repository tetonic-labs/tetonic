[package]
name = "tetonic-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# No network deps by construction (Charter Right 1). Tools are workspace-scoped.
[lib]
name = "tetonic_tools"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
tetonic-policy = { path = "../../core/tetonic-policy" }
tetonic-memory = { path = "../../strata/tetonic-memory" }
tetonic-telemetry = { path = "../../core/tetonic-telemetry" }
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-sandbox = { path = "../../core/tetonic-sandbox" }
tetonic-secrets = { path = "../../core/tetonic-secrets" }
tetonic-transaction = { path = "../../core/tetonic-transaction" }
tokio = { workspace = true, features = ["rt", "macros"] }
async-trait = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
