[package]
name = "lokai-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# No network deps by construction (Charter Right 1). Tools are workspace-scoped.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
lokai-policy = { package = "tetonic-policy", path = "../../core/tetonic-policy" }
lokai-memory = { package = "tetonic-memory", path = "../../strata/tetonic-memory" }
lokai-telemetry = { package = "tetonic-telemetry", path = "../../core/tetonic-telemetry" }
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
lokai-sandbox = { package = "tetonic-sandbox", path = "../../core/tetonic-sandbox" }
lokai-secrets = { package = "tetonic-secrets", path = "../../core/tetonic-secrets" }
lokai-transaction = { package = "tetonic-transaction", path = "../../core/tetonic-transaction" }
tokio = { workspace = true, features = ["rt", "macros"] }
async-trait = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
