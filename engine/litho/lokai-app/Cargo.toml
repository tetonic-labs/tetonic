[package]
name = "lokai-app"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
description = "Application Kernel"

[dependencies]
lokai-core = { package = "tetonic-core", path = "../../core/tetonic-core" }
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
lokai-policy = { package = "tetonic-policy", path = "../../core/tetonic-policy" }
lokai-secrets = { package = "tetonic-secrets", path = "../../core/tetonic-secrets" }
lokai-runtime = { package = "tetonic-runtime", path = "../../core/tetonic-runtime" }
lokai-telemetry = { package = "tetonic-telemetry", path = "../../core/tetonic-telemetry" }
lokai-memory = { package = "tetonic-memory", path = "../../strata/tetonic-memory" }
lokai-inference = { package = "tetonic-inference", path = "../../atmos/tetonic-inference" }
lokai-orchestrator = { package = "tetonic-orchestrator", path = "../../mantle/tetonic-orchestrator" }
lokai-run = { package = "tetonic-run", path = "../../mantle/tetonic-run" }
lokai-context = { package = "tetonic-context", path = "../../strata/tetonic-context" }
lokai-tools = { path = "../../litho/lokai-tools" }
lokai-transaction = { package = "tetonic-transaction", path = "../../core/tetonic-transaction" }
lokai-index = { package = "tetonic-index", path = "../../strata/tetonic-index" }
lokai-lsp = { path = "../../litho/lokai-lsp" }
lokai-sandbox = { package = "tetonic-sandbox", path = "../../core/tetonic-sandbox" }
lokai-capacity = { package = "tetonic-capacity", path = "../../mantle/tetonic-capacity" }
lokai-enroll = { package = "tetonic-enroll", path = "../../mantle/tetonic-enroll" }
lokai-egress = { package = "tetonic-egress", path = "../../atmos/tetonic-egress" }
lokai-node = { package = "tetonic-node", path = "../../mantle/tetonic-node" }
lokai-fabric-client = { package = "tetonic-fabric-client", path = "../../atmos/tetonic-fabric-client" }
lokai-broker = { package = "tetonic-broker", path = "../../mantle/tetonic-broker" }
lokai-fabric-protocol = { package = "tetonic-fabric-protocol", path = "../../atmos/tetonic-fabric-protocol" }
chrono = { workspace = true }
base64 = "0.22"
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
lokai-artifact = { package = "tetonic-artifact", version = "0.0.0", path = "../../strata/tetonic-artifact" }
futures = "0.3.32"
directories = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
hex = "0.4"
sha2 = "0.10"
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tetonic-eval = { path = "../../tooling/tetonic-eval" }
