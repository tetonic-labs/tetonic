[package]
name = "lokai-capacity"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = false

# Capacity plane: runtime profiles, bench gates, doctor types.
# Depends on lokai-inference only via the InferenceClient boundary.
# No dependency on lokai-core agent loop or lokai-egress.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["chrono"] }
chrono = { workspace = true, features = ["serde"] }
lokai-memory = { path = "../../strata/lokai-memory" }
lokai-inference = { path = "../../atmos/lokai-inference" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
directories = "5"
thiserror = { workspace = true }
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3"