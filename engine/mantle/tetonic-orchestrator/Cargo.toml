[package]
name = "tetonic-orchestrator"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
name = "tetonic_orchestrator"

[dependencies]
tetonic-inference = { path = "../../atmos/tetonic-inference" }
tetonic-memory = { path = "../../strata/tetonic-memory" }
tetonic-policy = { path = "../../core/tetonic-policy" }
tetonic-tools = { path = "../../litho/tetonic-tools" }
tetonic-core = { path = "../../core/tetonic-core" }
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-context = { path = "../../strata/tetonic-context" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tetonic-index = { path = "../../strata/tetonic-index" }
tetonic-runtime = { path = "../../core/tetonic-runtime" }
tetonic-transaction = { path = "../../core/tetonic-transaction" }
