[package]
name = "lokai-orchestrator"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
lokai-inference = { path = "../../atmos/lokai-inference" }
lokai-memory = { path = "../../strata/lokai-memory" }
lokai-policy = { package = "tetonic-policy", path = "../../core/tetonic-policy" }
lokai-tools = { path = "../../litho/lokai-tools" }
lokai-core = { package = "tetonic-core", path = "../../core/tetonic-core" }
lokai-domain = { package = "tetonic-domain", path = "../../core/tetonic-domain" }
lokai-context = { path = "../../strata/lokai-context" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
lokai-index = { path = "../../strata/lokai-index" }
lokai-runtime = { package = "tetonic-runtime", path = "../../core/tetonic-runtime" }
lokai-transaction = { package = "tetonic-transaction", path = "../../core/tetonic-transaction" }
