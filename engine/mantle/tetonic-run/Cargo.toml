[package]
name = "tetonic-run"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Durable run supervisor and task state machine (M3-1)"

[lib]
name = "tetonic_run"

[dependencies]
tetonic-artifact = { path = "../../strata/tetonic-artifact" }
tetonic-core = { path = "../../core/tetonic-core" }
tetonic-runtime = { path = "../../core/tetonic-runtime" }
tetonic-policy = { path = "../../core/tetonic-policy" }
async-trait = { workspace = true }
tetonic-domain = { path = "../../core/tetonic-domain" }
tetonic-memory = { path = "../../strata/tetonic-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# M6 fault injection: tests/m6_durable_integrity.rs breaks the journal from a
# second connection so the recovery write fails for real, rather than through a
# test-only hook in production code.
rusqlite = { workspace = true }

[[test]]
name = "matrix"
path = "tests/matrix.rs"

[[test]]
name = "fault_matrix"
path = "tests/fault_matrix.rs"
