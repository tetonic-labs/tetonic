[package]
name = "lokai-runtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Mandatory production runtime assembly (AC2-1)"

[dependencies]
lokai-core = { path = "../../core/lokai-core" }
lokai-domain = { path = "../../core/lokai-domain" }
lokai-inference = { path = "../../atmos/lokai-inference" }
lokai-memory = { path = "../../strata/lokai-memory" }
lokai-policy = { path = "../../core/lokai-policy" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
lokai-context = { path = "../../strata/lokai-context" }
lokai-artifact = { version = "0.0.0", path = "../../strata/lokai-artifact" }
lokai-egress = { path = "../../atmos/lokai-egress" }
lokai-tools = { path = "../../litho/lokai-tools" }
lokai-transaction = { path = "../../core/lokai-transaction" }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

