[package]
name = "tetonic-runtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Mandatory production runtime assembly (AC2-1)"

[lib]
name = "tetonic_runtime"

[dependencies]
tetonic-core = { path = "../tetonic-core" }
tetonic-domain = { path = "../tetonic-domain" }
lokai-inference = { path = "../../atmos/lokai-inference" }
lokai-memory = { path = "../../strata/lokai-memory" }
tetonic-policy = { path = "../tetonic-policy" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
lokai-context = { path = "../../strata/lokai-context" }
lokai-artifact = { version = "0.0.0", path = "../../strata/lokai-artifact" }
lokai-egress = { path = "../../atmos/lokai-egress" }
lokai-tools = { path = "../../litho/lokai-tools" }
tetonic-transaction = { path = "../tetonic-transaction" }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

