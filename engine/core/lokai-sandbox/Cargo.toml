[package]
name = "lokai-sandbox"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Production OS sandbox backend for untrusted repository processes (M2-3)"

[dependencies]
async-trait = { workspace = true }
lokai-domain = { path = "../../core/lokai-domain" }
lokai-secrets = { path = "../../core/lokai-secrets" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "time", "process"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "sched", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[[bin]]
name = "lokai-sandbox-adv"
path = "bins/adversarial_runner.rs"
test = false
