[package]
name = "tetonic-secrets"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "tetonic_secrets"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }

tetonic-domain = { path = "../tetonic-domain" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1.0", default-features = false, features = ["crypto-rust", "vendored"] }
