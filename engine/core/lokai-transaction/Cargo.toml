[package]
name = "lokai-transaction"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Workspace-versioned transactions (M2-4)"

[dependencies]
lokai-domain = { path = "../../core/lokai-domain" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
fs2 = "0.4"
chrono = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
tempfile = "3"
lokai-telemetry = { path = "../../core/lokai-telemetry" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "matrix"
path = "tests/matrix.rs"
