name: engine-ci

on:
  push:
    branches: [main, master]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  schedule:
    # Nightly so the bench job's `if:` can fire, and Windows gets a full run.
    - cron: "0 7 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: engine

jobs:
  # Run lifecycle regressions independently of unrelated workspace lint failures.
  unix-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Native sandbox build and unit tests
        run: cargo test -p lokai-sandbox --lib
      - name: Native database migration interruption and recovery
        run: cargo test -p lokai-memory
      - name: Native worker key lifecycle and secure-store adapter build
        run: cargo test -p lokai-node --lib tls_identity
      - name: Native secure-store reference rejection
        run: cargo test -p lokai-secrets --lib key_storage::tests::rejects_unknown_versions_and_foreign_credential_names -- --exact
      - name: Native artifact ownership and cross-process cleanup
        run: cargo test -p lokai-artifact
      - name: Native transaction permissions and durability ordering
        run: cargo test --locked -p lokai-transaction
      - name: Native context restrictions and revocation
        run: cargo test --locked -p lokai-context
      - name: Native process ownership, cancellation, and pipe cleanup
        run: cargo test -p lokai-sandbox --test unix_lifecycle

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Combined fmt + clippy -D warnings + ARCH-* + QG-* static.
      # Do not also run cargo fmt / clippy / lokai-arch-gate separately in this job.
      # Do not use `verify full` here (that would rerun cargo test inside the gate).
      - name: Engineering gate (fmt, clippy, architecture, quality)
        run: cargo run -p lokai-arch-gate -- verify package

      - name: test
        run: cargo test --workspace

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --deny warnings

      - name: Required-test gate regression tests
        run: python -m unittest discover -s scripts -p test_required_tests.py

      - name: security fixtures (offline)
        run: |
          python scripts/run_required_tests.py lokai-orchestrator security_fixture
          python scripts/run_required_tests.py lokai-orchestrator briefing_delimits
          python scripts/run_required_tests.py lokai-tools split_verify_rejects
          python scripts/run_required_tests.py lokai-memory zstd_rejects
          python scripts/run_required_tests.py lokai-memory approval_rule
          python scripts/run_required_tests.py lokai-fabric-client tls13_rejects
          python scripts/run_required_tests.py lokaid strict_rpc

      - name: fabric protocol docs (M5-1)
        run: python scripts/gen_fabric_protocol_doc.py --check

      - name: egress default-deny (privacy smoke)
        run: python scripts/run_required_tests.py lokai-egress tests::public_host_is_denied_by_default --exact

  # H4-2: recorded-fixture behavioral gate. Floor 1.0 on quality+security (Q6).
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: lokai-eval unit tests
        run: cargo test -p lokai-eval --lib

      - name: corpus integrity
        run: cargo run -p lokai-eval -- integrity --corpus corpus

      - name: quality subset
        run: cargo run -p lokai-eval -- run --subset quality --corpus corpus --out target/eval-quality.json

      - name: security subset (07 + 12)
        run: cargo run -p lokai-eval -- run --subset security --corpus corpus --out target/eval-security.json

      - name: PR subset vs baseline
        run: |
          cargo run -p lokai-eval -- run --subset pr --corpus corpus --out target/eval-pr.json
          cargo run -p lokai-eval -- compare --baseline corpus/ci_baseline.json --candidate target/eval-pr.json

  # H4-2 AC5: 10-trial statistical run of the PR subset. Artifact is the durable record.
  eval-statistical:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: statistical PR subset
        run: cargo run -p lokai-eval -- run --subset pr --mode statistical --corpus corpus --out target/eval-stat.json

      - uses: actions/upload-artifact@v4
        with:
          name: eval-statistical
          path: engine/target/eval-stat.json

  # H4-1: the platform the owner develops on. Independent of Linux fmt/clippy.
  # Branch protection: require the `windows-required` check on main.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Windows crate tests
        run: cargo test -p lokai-sandbox -p lokai-tools -p lokai-memory -p lokai-index -p lokai-artifact

      - name: Native Windows lifecycle and handle accounting
        shell: pwsh
        run: |
          rustc --edition 2021 --crate-name audit_pipe_holder capabilities/lokai-sandbox/tests/support/pipe_holder.rs -o target/debug/audit-pipe-holder.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOKAI_AUDIT_CHILD_HELPER = (Resolve-Path target/debug/audit-pipe-holder.exe).Path
          cargo test --locked -p lokai-sandbox --test audit_20260919 -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lokai-sandbox --lib backend::windows::tests::service_drop_kills_child_and_stop_is_repeatable -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native Windows disposable credential-store round trip
        run: cargo test --locked -p lokai-secrets --lib key_storage::tests::native_round_trip_delete_and_missing -- --ignored --exact --test-threads=1

  # H1-3: macOS equal first-class sandbox confinement.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: macOS sandbox tests
        run: cargo test -p lokai-sandbox -p lokai-tools

  windows-required:
    name: windows-required
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - name: Windows crate tests must have succeeded
        run: |
          if [ "${{ needs.windows.result }}" != "success" ]; then
            echo "windows job result: ${{ needs.windows.result }}"
            exit 1
          fi

  macos-required:
    name: macos-required
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - name: macOS crate tests must have succeeded
        run: |
          if [ "${{ needs.macos.result }}" != "success" ]; then
            echo "macos job result: ${{ needs.macos.result }}"
            exit 1
          fi

  # Agentic bench needs a local Ollama + model; run on schedule / manual only.
  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: build lokai
        run: cargo build --release -p lokai-cli

      - name: install ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: pull model
        run: ollama pull qwen3.6:latest

      - name: agentic suite (Sprint A gate)
        env:
          LOKAI_BIN: ${{ github.workspace }}/engine/target/release/lokai
        run: |
          python bench/run_suite.py \
            --out bench/results_ci.json \
            --min-pass 5
