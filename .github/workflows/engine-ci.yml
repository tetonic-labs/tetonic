name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: engine

jobs:
  gate:
    name: Architecture & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Engineering gate (formatting, clippy, architecture, quality)
        run: cargo run -p tetonic-arch-gate -- verify package

  test:
    name: Core Test Suite
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Run Core Tests
        run: |
          cargo test -p tetonic-core \
                     -p tetonic-policy \
                     -p tetonic-secrets \
                     -p tetonic-domain \
                     -p tetonic-tools \
                     -p tetonic-artifact \
                     -p tetonic-transaction \
                     -p tetonic-egress \
                     -p tetonic-telemetry \
                     -p tetonic-cli \
                     -p tetonic-app

  build-matrix:
    name: Cross-Platform Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build release binaries
        run: cargo build --release -p tetonic-cli -p tetonicd
