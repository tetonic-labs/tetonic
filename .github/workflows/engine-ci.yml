name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: engine

jobs:
  workspace:
    name: Workspace Boundaries & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  gate:
    name: Architecture & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0 # Keep in sync with engine/rust-toolchain.toml.
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Engineering gate (formatting, clippy, architecture, quality)
        run: cargo run --locked -p tetonic-arch-gate -- verify package

  test:
    name: Core Test Suite
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0 # Keep in sync with engine/rust-toolchain.toml.

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Run Core Tests
        run: |
          cargo test --locked -p tetonic-core \
                     -p tetonic-policy \
                     -p tetonic-secrets \
                     -p tetonic-domain \
                     -p tetonic-tools \
                     -p tetonic-artifact \
                     -p tetonic-transaction \
                     -p tetonic-egress \
                     -p tetonic-telemetry \
                     -p tetonic-memory \
                     -p tetonic-run \
                     -p tetonic-arch-gate \
                     -p tetonic-cli \
                     -p tetonic-app

  build-matrix:
    name: Cross-Platform Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0 # Keep in sync with engine/rust-toolchain.toml.

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build release binaries
        run: cargo build --locked --release -p tetonic-cli
